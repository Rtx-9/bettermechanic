[project]
name = "bettermechanic"
version = "0.1.0"
description = "Fast photo culling, player-tagging presets and card ingest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "Pillow>=10.0"]

[project.gui-scripts]
bettermechanic = "bettermechanic.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bettermechanic"]
