[project]
name = "bettermechanic"
version = "0.4.0"
description = "Fast photo culling, player-tagging presets and card ingest"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.6", "Pillow>=10.0", "numpy>=1.26"]

[project.gui-scripts]
bettermechanic = "bettermechanic.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bettermechanic"]

[tool.setuptools.package-data]
bettermechanic = ["assets/*.png"]
